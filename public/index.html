<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi aventura con Git</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container py-5">
      <section class="hero mx-auto p-4 p-md-5 text-center shadow-lg">
        <div class="display-3 mb-3">🚀</div>
        <h1 class="display-5 fw-bold">¡Mi proyecto ya funciona!</h1>
        <p class="lead mb-4">
          Esta página usa Node.js, Express, Bootstrap y JavaScript.
        </p>
        <button id="probar" class="btn btn-warning btn-lg fw-semibold">
          Probar el servidor
        </button>
        <p id="resultado" class="status mt-4 mb-0" aria-live="polite">
          Presiona el botón para comprobar la conexión.
        </p>
      </section>

      <section class="row g-4 mt-4" aria-label="Herramientas del proyecto">
        <div class="col-md-4">
          <article class="card h-100 border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h4">📸 Git</h2>
              <p class="mb-0">Guarda fotos de cada versión de tu trabajo.</p>
            </div>
          </article>
        </div>
        <div class="col-md-4">
          <article class="card h-100 border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h4">🏠 Express</h2>
              <p class="mb-0">Organiza las rutas y sirve esta página.</p>
            </div>
          </article>
        </div>
        <div class="col-md-4">
          <article class="card h-100 border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h4">📦 MySQL</h2>
              <p class="mb-0">Queda preparado para guardar datos después.</p>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
